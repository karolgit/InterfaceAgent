<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44506a"/>
    </marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a15c00"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:650;fill:#16202f}
      .s{font-size:12px;fill:#3c4658}
      .l{font-size:11px;fill:#44506a;font-style:italic}
      .edge{stroke:#44506a;stroke-width:1.6;fill:none;marker-end:url(#ah)}
      .human{stroke:#a15c00;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#ahA)}
      .ev{stroke:#7a8496;stroke-width:1.3;fill:none;stroke-dasharray:4 4;marker-end:url(#ah)}
    </style>
  </defs>
  <rect width="1300" height="640" fill="#ffffff"/>

  <!-- Row A -->
  <rect x="40" y="30" width="240" height="80" rx="10" fill="#e8f0fd" stroke="#4a78c4"/>
  <text x="160" y="62" text-anchor="middle" class="t">Capability request</text>
  <text x="160" y="82" text-anchor="middle" class="s">goal + typed inputs / outputs</text>
  <text x="160" y="98" text-anchor="middle" class="s">tasks/*.yaml</text>

  <rect x="560" y="30" width="220" height="80" rx="10" fill="#f1ebfb" stroke="#7a55c0"/>
  <text x="670" y="62" text-anchor="middle" class="t">Member Assistant</text>
  <text x="670" y="82" text-anchor="middle" class="s">chat + voice · LLM picks tools</text>
  <text x="670" y="98" text-anchor="middle" class="s">member confirms irreversible</text>

  <rect x="840" y="30" width="220" height="80" rx="10" fill="#f1ebfb" stroke="#7a55c0"/>
  <text x="950" y="62" text-anchor="middle" class="t">Capability Gateway</text>
  <text x="950" y="82" text-anchor="middle" class="s">catalog of approved capabilities</text>
  <text x="950" y="98" text-anchor="middle" class="s">identity binding · pending confirm</text>

  <rect x="1100" y="30" width="170" height="80" rx="10" fill="#fdf1e0" stroke="#a15c00"/>
  <text x="1185" y="62" text-anchor="middle" class="t">Operator Console</text>
  <text x="1185" y="82" text-anchor="middle" class="s">queue · claim · resolve</text>
  <text x="1185" y="98" text-anchor="middle" class="s">human drives live session</text>

  <!-- Row B -->
  <rect x="40" y="170" width="240" height="90" rx="10" fill="#e8f0fd" stroke="#4a78c4" stroke-width="1.8"/>
  <text x="160" y="200" text-anchor="middle" class="t">Discovery Agent (LLM)</text>
  <text x="160" y="220" text-anchor="middle" class="s">observe → decide → act, one step/turn</text>
  <text x="160" y="237" text-anchor="middle" class="s">redacted outline + screenshot</text>
  <text x="160" y="252" text-anchor="middle" class="s">acts on refs · inputs by name</text>

  <rect x="330" y="170" width="170" height="90" rx="10" fill="#eef1f6" stroke="#6b7689"/>
  <text x="415" y="200" text-anchor="middle" class="t">Compiler</text>
  <text x="415" y="220" text-anchor="middle" class="s">trace → ranked locators,</text>
  <text x="415" y="237" text-anchor="middle" class="s">checkpoints, params,</text>
  <text x="415" y="252" text-anchor="middle" class="s">risk classes</text>

  <rect x="550" y="170" width="230" height="90" rx="10" fill="#fff8d9" stroke="#b39200" stroke-width="1.8"/>
  <text x="665" y="200" text-anchor="middle" class="t">Capability Artifact</text>
  <text x="665" y="220" text-anchor="middle" class="s">contract: inputs · outputs · outcomes</text>
  <text x="665" y="237" text-anchor="middle" class="s">flow: steps · locators · checkpoints</text>
  <text x="665" y="252" text-anchor="middle" class="s">versioned JSON · draft → approved</text>

  <rect x="840" y="170" width="220" height="90" rx="10" fill="#e6f5ea" stroke="#2e8a4a" stroke-width="1.8"/>
  <text x="950" y="200" text-anchor="middle" class="t">Replay Engine (no LLM)</text>
  <text x="950" y="220" text-anchor="middle" class="s">resolve · gate · act · verify</text>
  <text x="950" y="237" text-anchor="middle" class="s">outcome rules → success /</text>
  <text x="950" y="252" text-anchor="middle" class="s">business outcome / recover / fail</text>

  <rect x="1100" y="170" width="170" height="90" rx="10" fill="#eef1f6" stroke="#6b7689"/>
  <text x="1185" y="200" text-anchor="middle" class="t">App Profile</text>
  <text x="1185" y="220" text-anchor="middle" class="s">per vendor product:</text>
  <text x="1185" y="237" text-anchor="middle" class="s">sign-on · error taxonomy</text>
  <text x="1185" y="252" text-anchor="middle" class="s">PII labels · tenant overrides</text>

  <!-- Row C -->
  <rect x="40" y="310" width="1020" height="52" rx="10" fill="#fcebea" stroke="#b8453b"/>
  <text x="550" y="332" text-anchor="middle" class="t">Policy &amp; redaction (every action, discovery and replay)</text>
  <text x="550" y="350" text-anchor="middle" class="s">allowlist of actions / windows / keys · risk classes: safe, risky, irreversible (needs approval), blocked · PII masked in logs, screenshots, prompts</text>

  <rect x="1100" y="300" width="170" height="72" rx="10" fill="#f6f7f9" stroke="#8a93a4" stroke-dasharray="5 4"/>
  <text x="1185" y="326" text-anchor="middle" class="t">Evidence</text>
  <text x="1185" y="344" text-anchor="middle" class="s">redacted JSONL logs,</text>
  <text x="1185" y="360" text-anchor="middle" class="s">screenshots, tree dumps</text>

  <!-- Row D -->
  <rect x="40" y="410" width="1020" height="70" rx="10" fill="#e9eef6" stroke="#44506a" stroke-width="1.8"/>
  <text x="550" y="436" text-anchor="middle" class="t">Surface driver: Java accessibility bridge (loaded with -javaagent into the unmodified app)</text>
  <text x="550" y="456" text-anchor="middle" class="s">accessibility tree (roles, names, labels, bounds) · accessibility actions · offscreen screenshots</text>
  <text x="550" y="472" text-anchor="middle" class="s">control lock: agent | paused | human (human input blocked while agent holds control) · human-input recorder</text>

  <rect x="1100" y="410" width="170" height="70" rx="10" fill="#ffffff" stroke="#8a93a4" stroke-dasharray="5 4"/>
  <text x="1185" y="434" text-anchor="middle" class="t">Same seam, designed</text>
  <text x="1185" y="452" text-anchor="middle" class="s">Windows UIA · web a11y</text>
  <text x="1185" y="468" text-anchor="middle" class="s">3270 · OCR / vision</text>

  <!-- Row E -->
  <rect x="40" y="520" width="1020" height="56" rx="10" fill="#dde3ec" stroke="#44506a"/>
  <text x="550" y="545" text-anchor="middle" class="t">CoreLink: legacy Swing core-banking client</text>
  <text x="550" y="564" text-anchor="middle" class="s">MDI frames · modal dialogs · no test IDs · unlinked labels · runtime faults · two tenants on different versions</text>

  <!-- Edges -->
  <path class="edge" d="M160,110 V168"/>
  <path class="edge" d="M280,215 H328"/>
  <path class="edge" d="M500,215 H548"/>
  <path class="edge" d="M780,215 H838"/>
  <text x="809" y="207" text-anchor="middle" class="l">load</text>
  <path class="edge" d="M780,70 H838"/>
  <text x="809" y="62" text-anchor="middle" class="l">tool call</text>
  <path class="edge" d="M950,110 V168"/>
  <text x="942" y="145" text-anchor="end" class="l">invoke(params)</text>
  <path class="edge" d="M1100,215 H1062"/>
  <path class="edge" d="M160,260 V308"/>
  <path class="edge" d="M950,260 V308"/>
  <path class="edge" d="M550,362 V408"/>
  <path class="edge" d="M550,480 V518"/>
  <path class="edge" d="M600,518 V482"/>
  <path class="human" d="M1040,170 C1060,140 1110,135 1130,112"/>
  <text x="1068" y="128" text-anchor="end" class="l" fill="#a15c00">stuck / approval</text>
  <path class="human" d="M1170,112 C1150,150 1100,160 1062,178"/>
  <text x="1168" y="158" class="l" fill="#a15c00">resume</text>
  <path class="ev" d="M1060,245 C1085,265 1095,285 1110,300"/>

  <!-- Legend -->
  <g transform="translate(40,600)" font-size="12" fill="#3c4658">
    <rect width="14" height="14" rx="3" fill="#e8f0fd" stroke="#4a78c4"/><text x="20" y="12">LLM, once per capability</text>
    <rect x="200" width="14" height="14" rx="3" fill="#e6f5ea" stroke="#2e8a4a"/><text x="220" y="12">deterministic, production path</text>
    <rect x="430" width="14" height="14" rx="3" fill="#fdf1e0" stroke="#a15c00"/><text x="450" y="12">human in the loop</text>
    <rect x="590" width="14" height="14" rx="3" fill="#fcebea" stroke="#b8453b"/><text x="610" y="12">safety</text>
    <rect x="680" width="14" height="14" rx="3" fill="#f1ebfb" stroke="#7a55c0"/><text x="700" y="12">agent-facing (stretch)</text>
  </g>
</svg>
